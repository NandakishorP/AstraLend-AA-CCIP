[profile.default]
src = "src"
out = "out"
libs = ["lib"]
rpc_endpoints = { eth = "https://eth-sepolia.g.alchemy.com/v2/tBB8RGqhj5jDY_HavrsouAD9KmayCNkd", arb = "https://arb-sepolia.g.alchemy.com/v2/tBB8RGqhj5jDY_HavrsouAD9KmayCNkd"}

# rpc_endpoints = { chainA = "http://localhost:8545", chainB = "http://localhost:8546"}
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = "10000000000"  
remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts',
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts',
    '@ccip/=lib/ccip/',
    '@chainlink/local/=lib/chainlink-local/',
    # chainlink-local v0.2.6 moved its CCIP dependency from a vendored `lib/ccip`
    # to the `chainlink-ccip` repo, which nests the Solidity under chains/evm.
    # Declared explicitly because auto-detection resolves it to the old path.
    '@chainlink/contracts-ccip/=lib/chainlink-local/lib/chainlink-ccip/chains/evm/'
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
